services:
  medcat-service:
    image: cogstacksystems/medcat-service:v1.1.1
    platform: linux/amd64
    container_name: medcat-service
    ports:
      - "${MEDCAT_PORT:-5000}:5000"
    volumes:
      - ./models:/cat/models:rw
      - ./medcat-init.sh:/medcat-init.sh:ro
    entrypoint: ["/bin/bash", "/medcat-init.sh"]
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - APP_MODEL_CDB_PATH=/cat/models/medmen.cdb
      - APP_MODEL_VOCAB_PATH=/cat/models/vocab.dat
      - SPACY_MODEL=en_core_web_md
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/info"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 2m

  fastapi-backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: fastapi-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      medcat-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MEDCAT_URL=http://medcat-service:5000/api/process
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - app-network

  frontend:
    build:
      context: ../frontend
      dockerfile: dockerfile
    container_name: react-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3030}:3030"
    environment:
      - HOST=0.0.0.0
      - REACT_APP_BACKEND_URL=http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8010}
      - REACT_APP_BACKEND_WS_URL=ws://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8010}
    depends_on:
      - fastapi-backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
